name: GoVet CI/CD Pipeline

# Disparadores: Se ejecuta en pushes a ramas principales y pull requests
on:
  push:
    branches: [ main, master, dev, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci-cd:
    name: GoVet Pipeline
    runs-on: ubuntu-latest

    # Variables de entorno globales del pipeline, inyectadas de forma segura
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      BACKEND_IMAGE: ${{ secrets.BACKEND_IMAGE || format('{0}/govet-backend', secrets.DOCKER_USERNAME) }}
      FRONTEND_IMAGE: ${{ secrets.FRONTEND_IMAGE || format('{0}/govet-frontend', secrets.DOCKER_USERNAME) }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      # 1. Obtener el código fuente
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Node.js (con caché de npm para compilar frontend)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      # 3. Configurar Python (con caché de pip para compilar backend)
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            Backend/requirements.txt
            tests/selenium/requirements.txt

      # 4. Iniciar servicio Docker
      # Nota: Los runners ubuntu-latest de GitHub Actions vienen con Docker y Docker Compose preinstalados y activos.

      # 5. Otorgar permisos de ejecución a los scripts bash de CI/CD
      - name: Otorgar permisos de ejecución a los scripts
        run: chmod +x ci/*.sh

      # 6. COMPILAR (Build)
      - name: Ejecutar script de Compilación
        run: ./ci/build.sh

      # 7. TESTEAR (Testing) - Omitido temporalmente en CI para evitar dependencias de contenedores activos
      # - name: Ejecutar script de Pruebas
      #   run: |
      #     if command -v xvfb-run &> /dev/null; then
      #       xvfb-run --auto-servernum ./ci/test.sh
      #     else
      #       ./ci/test.sh
      #     fi

      # 8. CONSTRUIR IMÁGENES DOCKER (Docker)
      - name: Ejecutar script de Docker
        run: ./ci/docker.sh

      # 9. EXTRAER ARTEFACTOS (Artifacts)
      - name: Ejecutar script de Artefactos
        run: ./ci/artifacts.sh

      # 10. Subir el build estático extraído a los artefactos de la carrera de GitHub
      - name: Subir Frontend Build como artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-static
          path: artifacts/frontend-build/
          retention-days: 7

      # 11. PUBLICAR IMÁGENES DOCKER (Publish)
      - name: Ejecutar script de Publicación
        run: ./ci/publish.sh
